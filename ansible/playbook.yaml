---
- name: Deploy btbot from GitHub Actions runner
  hosts: localhost
  become: true
  vars:
    source_dir: "/home/pi/actions-runner/_work/btbot/btbot"
    target_dir: "/opt/btbot"

  tasks:
    - name: Ensure target directory exists
      file:
        path: "{{ target_dir }}"
        state: directory
        owner: pi
        group: pi
        mode: '0755'

    - name: Copy bot files to /opt/btbot
      synchronize:
        src: "{{ source_dir }}/"
        dest: "{{ target_dir }}/"
        delete: no
        recursive: yes

    - name: Ensure python3-venv is installed
      apt:
        name: python3-venv
        state: present
        update_cache: yes

    - name: Create Python virtual environment if missing
      command: python3 -m venv {{ target_dir }}/.venv
      args:
        creates: "{{ target_dir }}/.venv/bin/activate"

    - name: Upgrade pip in the virtualenv
      ansible.builtin.pip:
        virtualenv: "{{ target_dir }}/.venv"
        name: pip
        state: latest

    - name: Install project in editable mode
      command: "{{ target_dir }}/.venv/bin/pip install -e ."
      args:
        chdir: "{{ target_dir }}"

    - name: Copy the .env temlplate file
      command: "cp /home/pi/.env.j2 /opt/btbot/.env"

    - name: Stop epictrader.service
      ansible.builtin.systemd:
        name: epictrader.service
        state: stopped
    
    - name: Disable epictrader.service
      ansible.builtin.systemd:
        name: epictrader.service
        enabled: no
    
    - name: Render and deploy systemd unit templates
      template:
        src: "{{ item }}"
        dest: "/etc/systemd/system/{{ item | basename | regex_replace('\\.j2$','') }}"
        owner: root
        group: root
        mode: '0644'
      loop: "{{ lookup('fileglob', '/opt/btbot/files/*.service.j2', wantlist=True) }}"

    - name: Reload systemd daemon 
      ansible.builtin.systemd: 
        daemon_reload: yes
    
    - name: Enable services 
      ansible.builtin.systemd: 
        name: "{{ item }}" 
        enabled: yes 
      loop: 
        - ohlc-stream.service 
        - gh-ar.service 
        - dow-trader.service 
        - ftse-trader.service 
        - uscgc-trader.service 

    - name: Restart services
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: restarted
        enabled: true
      loop:
        - ohlc-stream.service 
        - btbot.service 
        - gh-ar.service 
        - dow-trader.service 
        - ftse-trader.service 
        - uscgc-trader.service 

    - name: Ensure Raspberry Pi reboots daily at 11pm
      ansible.builtin.cron:
        name: "Daily reboot at 11pm"
        minute: "0"
        hour: "23"
        job: "/sbin/shutdown -r now"
        user: "root"
